services:
  db:
    image: mysql:8.0
    container_name: prediction_container
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
  redis:
    image: redis:6.2-alpine
    container_name: redis-prediction
    restart: always
    ports:
      - "6380:6379"

volumes:
  db_data:
